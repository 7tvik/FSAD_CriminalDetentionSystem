# Test profile: in-memory H2 in MySQL-compatibility mode.
# Flyway is disabled for tests; schema is created by Hibernate and each test seeds its own data.
spring:
  datasource:
    url: jdbc:h2:mem:cdp_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: test_secret_key_used_only_for_tests_at_least_32_bytes_long_xxxx
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.kt.cdp: WARN
