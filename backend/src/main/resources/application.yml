server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: criminal-detention-portal

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cdp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:cdp_user}
    password: ${DB_PASSWORD:change_me_local_only}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ===== Application-specific configuration =====
app:
  jwt:
    secret: ${JWT_SECRET:please_change_this_to_a_long_random_secret_at_least_32_bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===== OpenAPI / Swagger =====
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

# ===== Logging (never log secrets) =====
logging:
  level:
    root: INFO
    com.kt.cdp: INFO
    org.springframework.security: WARN
