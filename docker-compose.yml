version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: cdp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cdp}
      MYSQL_USER: ${DB_USERNAME:-cdp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cdp_local_dev_pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cdp_local_root_pw}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - cdp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "${DB_USERNAME:-cdp_user}", "-p${DB_PASSWORD:-cdp_local_dev_pw}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cdp_mysql_data:
