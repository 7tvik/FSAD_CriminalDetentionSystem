services:
  mysql:
    image: mysql:8.4
    container_name: cdp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cdp}
      MYSQL_USER: ${DB_USERNAME:-cdp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_local_only}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - cdp_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change_me_root_local_only}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  cdp_mysql_data:
